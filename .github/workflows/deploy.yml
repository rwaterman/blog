name: Deploy blog

on:
  push:
    branches: [develop, main]
  workflow_dispatch:
    inputs:
      env:
        description: "Target environment to deploy"
        required: true
        type: choice
        options:
          - dev
          - qa
          - staging
          - uat
          - prod

concurrency:
  group: deploy-${{ github.workflow }}-${{ github.event_name == 'workflow_dispatch' && inputs.env || github.ref_name }}
  cancel-in-progress: true

permissions:
  id-token: write
  contents: read

env:
  AWS_ACCOUNT_ID: ${{ secrets.AWS_ACCOUNT_ID }}
  AWS_REGION: us-west-2
  HUGO_VERSION: 0.163.3

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Resolve environment
        id: target
        env:
          REQUESTED_ENV: ${{ github.event_name == 'workflow_dispatch' && inputs.env || '' }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [ -n "$REQUESTED_ENV" ]; then
            TARGET_ENV="$REQUESTED_ENV"
          elif [ "$REF_NAME" = "main" ]; then
            TARGET_ENV="prod"
          else
            TARGET_ENV="dev"
          fi
          case "$TARGET_ENV" in
            prod) HOST="blog.rickwaterman.com" ;;
            dev|qa|staging|uat) HOST="blog-${TARGET_ENV}.rickwaterman.com" ;;
            *)
              echo "Unsupported environment: $TARGET_ENV" >&2
              exit 1
              ;;
          esac
          echo "name=$TARGET_ENV" >> "$GITHUB_OUTPUT"
          echo "host=$HOST" >> "$GITHUB_OUTPUT"

      # Hugo Modules are Go modules: Hugo shells out to the Go toolchain to fetch the
      # Congo theme (github.com/jpanther/congo/v2) into the module cache at build time.
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Install Hugo
        run: |
          curl -sSLf "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.tar.gz" \
            | sudo tar -xz -C /usr/local/bin hugo
          hugo version

      - name: Build site
        env:
          SITE_HOST: ${{ steps.target.outputs.host }}
        run: hugo --gc --minify --baseURL "https://${SITE_HOST}/"

      - name: Block indexing on non-prod
        if: steps.target.outputs.name != 'prod'
        run: |
          printf 'User-agent: *\nDisallow: /\n' > public/robots.txt

      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::${{ env.AWS_ACCOUNT_ID }}:role/blog-content-${{ steps.target.outputs.name }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Resolve deploy targets
        id: targets
        run: |
          BUCKET=$(aws ssm get-parameter --name "/blog/${{ steps.target.outputs.name }}/bucket-name" --query Parameter.Value --output text)
          DIST=$(aws ssm get-parameter --name "/blog/${{ steps.target.outputs.name }}/distribution-id" --query Parameter.Value --output text)
          echo "bucket=$BUCKET" >> "$GITHUB_OUTPUT"
          echo "distribution=$DIST" >> "$GITHUB_OUTPUT"

      - name: Sync to S3
        run: |
          # Hugo fingerprints its own assets, but page HTML keeps stable paths, so upload
          # everything must-revalidate and let the CloudFront invalidation below force a
          # full edge refresh on each deploy.
          aws s3 sync public/ "s3://${{ steps.targets.outputs.bucket }}" --delete \
            --cache-control "public,max-age=0,must-revalidate"

      - name: Invalidate CloudFront
        run: |
          aws cloudfront create-invalidation \
            --distribution-id "${{ steps.targets.outputs.distribution }}" \
            --paths "/*"

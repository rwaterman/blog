name: Deploy blog infra

on:
  workflow_dispatch:
    inputs:
      optional:
        description: "Optional environments to include, comma-separated (qa, staging, uat)"
        required: false
        default: ""
        type: string
  push:
    branches: [develop]
    paths:
      - "infra/**"
      - ".github/workflows/infra.yml"

permissions:
  id-token: write
  contents: read

env:
  AWS_ACCOUNT_ID: ${{ secrets.AWS_ACCOUNT_ID }}
  HOSTED_ZONE_ID: ${{ secrets.HOSTED_ZONE_ID }}
  AWS_REGION: us-west-2

jobs:
  cdk-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: infra/package-lock.json

      - name: Install
        working-directory: infra
        run: npm ci

      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::${{ env.AWS_ACCOUNT_ID }}:role/blog-infra-deploy
          aws-region: ${{ env.AWS_REGION }}

      - name: cdk deploy
        working-directory: infra
        env:
          OPTIONAL_ENVS: ${{ inputs.optional }}
        run: |
          ARGS=(deploy --all --require-approval never)
          if [ -n "$OPTIONAL_ENVS" ]; then
            ARGS+=(-c "optional=$OPTIONAL_ENVS")
          fi
          npx cdk "${ARGS[@]}"

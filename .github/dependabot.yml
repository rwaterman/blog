version: 2
updates:
  - package-ecosystem: npm
    directory: "/infra"
    schedule:
      interval: weekly
    groups:
      npm:
        patterns: ["*"]
      npm-security:
        applies-to: security-updates
        patterns: ["*"]
  - package-ecosystem: gomod
    directory: "/"
    schedule:
      interval: weekly
    groups:
      gomod:
        patterns: ["*"]
      gomod-security:
        applies-to: security-updates
        patterns: ["*"]
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns: ["*"]
      github-actions-security:
        applies-to: security-updates
        patterns: ["*"]
